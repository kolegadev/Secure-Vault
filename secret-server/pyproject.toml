[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secret-server"
version = "2.0.0-alpha"
description = "Pi5 Tailscale Secret Server for Secure Vault V2"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "OpenClaw Engineering", email = "engineering@openclaw.dev"},
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secret_server"]
